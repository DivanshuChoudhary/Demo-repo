<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>Student Result Card</h1>

    <div class="student-info">
        <img src="https://via.placeholder.com/120" alt="Student Photo" class="profile-pic">
        
    <h2>Divanshu Choudhary</h2>
    <p>Roll No: 12345</p>
    <p>Course: B.Tech CSE</p>
</div>

<table>
    <tr>
        <th>Subject</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td>Mathematics</td>
        <td><input type="number" class="mark-input" min="0" max="100"></td>
    </tr>

    <tr>
        <td>Physics</td>
        <td><input type="number" class="mark-input" min="0" max="100"></td>
    </tr>

    <tr>
        <td>Chemistry</td>
        <td><input type="number" class="mark-input" min="0" max="100"></td>
    </tr>

    <tr>
        <td>English</td>
        <td><input type="number" class="mark-input" min="0" max="100"></td>
    </tr>

    <tr>
        <td>Computer Science</td>
        <td><input type="number" class="mark-input" min="0" max="100"></td>
    </tr>
</table>

<button id="calculate-btn">Calculate Result</button>

<div class="result">
    <h3 id="percentage">Percentage: --</h3>
    <h3 id="grade">Grade: --</h3>
    <h3 id="status">Status: --</h3>
</div>

<script src="script.js"></script>

</div>

<script src="script.js"></script>


</body>
</html>
